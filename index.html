<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c1c22">
<meta name="description" content="A painting app with pressure brushes, layers, selections, transform and adjustments.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Easel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Easel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=DM+Serif+Display&family=Caveat:wght@600&family=Bebas+Neue&display=swap">
<style>
/* Layout: full-bleed canvas stage under a slim tool bar; floating sidebar, popovers and context bars over it. One dark studio look, chosen on purpose so artwork colors read true. */
:root{
  --stage:#141418;--bar:#1c1c22;--panel:#23232b;--panel-2:#2e2e38;--line:#3a3a46;
  --fg:#ececf2;--muted:#9d9dac;--accent:#8aa9ff;--accent-ink:#0e1530;--danger:#ff8a80;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:var(--stage);color:var(--fg);font-family:var(--ui)}
body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--bar);border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top,0px) max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px));min-height:calc(48px + env(safe-area-inset-top,0px))}
.grp{display:flex;align-items:center;gap:2px;min-width:0}
.tb{width:38px;height:38px;border:0;border-radius:10px;background:transparent;display:grid;place-items:center;color:var(--fg);flex:none}
.tb svg{width:22px;height:22px}
.tb:hover{background:var(--panel-2)}
.tb.on{color:var(--accent);background:var(--panel-2)}
.tb.open{background:var(--panel-2)}
.cbtn{width:38px;height:38px;border:0;background:transparent;display:grid;place-items:center;flex:none;touch-action:none}
#colorDot{width:28px;height:28px;border-radius:50%;border:2px solid #f4f4f8;box-shadow:0 0 0 1px #0006 inset,0 1px 4px #0008}
#stage{position:relative;flex:1;overflow:hidden;background:var(--stage)}
#view{position:absolute;inset:0;touch-action:none;display:block}
#side{position:absolute;top:50%;transform:translateY(-50%);left:calc(8px + env(safe-area-inset-left,0px));width:46px;padding:12px 0;border-radius:16px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:12px;z-index:3}
#side.right{left:auto;right:calc(8px + env(safe-area-inset-right,0px))}
.vs{position:relative;width:28px;height:min(150px,20vh);border-radius:14px;background:var(--panel-2);overflow:hidden;touch-action:none;cursor:ns-resize}
.vs .fill{position:absolute;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--accent) 38%,transparent)}
.vs .knob{position:absolute;left:3px;right:3px;height:6px;border-radius:3px;background:var(--fg)}
.sq{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);display:grid;place-items:center}
.sq svg{width:18px;height:18px}
.sq.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sb{width:36px;height:32px;border:0;border-radius:8px;background:transparent;display:grid;place-items:center}
.sb svg{width:21px;height:21px}
.sb:hover{background:var(--panel-2)}
#bubble{position:absolute;z-index:6;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;gap:10px;font:500 13px var(--mono);pointer-events:none}
#bubble i{display:block;border-radius:50%;background:var(--fg)}
#hud{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:10px;background:#0d0d11e6;border:1px solid var(--line);font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:7;white-space:nowrap}
#hud.show{opacity:1}
#ctx{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 24px);width:max-content;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;z-index:4;box-shadow:0 10px 30px #0008}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;font-weight:600;white-space:nowrap}
.chip:hover{border-color:#55556a}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.warn{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{height:32px;padding:0 11px;border:0;background:var(--panel-2);font-size:12.5px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.pop{position:fixed;z-index:20;width:360px;max-height:calc(100% - 90px - env(safe-area-inset-top,0px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 18px 50px #000a;overscroll-behavior:contain}
.pop.wide{width:420px}
.pop.sheet{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-height:74%;border-radius:18px 18px 0 0;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pop-h{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pop-h b{font-size:15px;font-weight:700;letter-spacing:.01em}
.sp{flex:1}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:3px 7px;border:1px solid var(--line);border-radius:6px}
.pop h4{margin:16px 0 8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.blib{display:grid;grid-template-columns:118px 1fr;gap:10px;min-height:220px}
.bcats{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);padding-right:8px}
.bcat{text-align:left;border:0;background:transparent;padding:8px 9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.bcat.on{background:var(--panel-2);color:var(--fg)}
.blist{display:flex;flex-direction:column;gap:6px;min-width:0}
.bitem{display:flex;flex-direction:column;align-items:stretch;gap:2px;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:7px 8px;font-size:13px;font-weight:600}
.bitem canvas{width:100%;height:40px;display:block}
.bitem.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:color-mix(in srgb,var(--accent) 60%,transparent)}
.studio{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.srow{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.srow output{font:500 12px var(--mono);color:var(--fg);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
.tog{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.svwrap,.huewrap{position:relative;touch-action:none}
#sv{width:100%;height:180px;border-radius:10px;display:block;cursor:crosshair}
#hue{width:100%;height:22px;border-radius:11px;display:block;margin-top:12px;cursor:ew-resize}
#svKnob,#hueKnob{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #0009,0 2px 5px #0008;pointer-events:none;transform:translate(-50%,-50%)}
#hueKnob{top:23px}
.cmp{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.cmp span{width:30px;height:22px;display:block}
.crow{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.crow input{width:96px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);padding:0 8px;font:500 13px var(--mono)}
.mono{font:500 12px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:6px}
.sw{aspect-ratio:1;max-width:100%;border-radius:7px;border:1px solid #ffffff24;padding:0}
.mini{height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel-2);font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--fg)}
.lhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lrow{display:grid;grid-template-columns:48px 1fr auto auto;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.lrow.on{background:color-mix(in srgb,var(--accent) 22%,transparent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.lrow.clip{margin-left:18px}
.lthumb{width:48px;height:36px;border-radius:5px;display:block;background:repeating-conic-gradient(#cfcfd6 0 25%,#fff 0 50%) 0 0/10px 10px}
.lname{min-width:0;display:flex;flex-direction:column;gap:2px}
.lname span{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lname small{font-size:11px;color:var(--muted)}
.lname input{height:28px;border-radius:6px;border:1px solid var(--accent);background:var(--panel-2);color:var(--fg);padding:0 6px;font:inherit;font-size:13px;width:100%}
.lblend{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);font:600 12px var(--mono)}
.lvis{width:20px;height:20px;accent-color:var(--accent)}
.lopts{margin:4px 0 8px 8px;padding:10px;border-radius:10px;background:var(--panel-2);display:flex;flex-direction:column;gap:8px}
.lopts .chip{background:var(--panel);height:32px}
.lopts select,.pop select,#modal select{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:0 8px;font:inherit;font-size:13px}
.bgrow{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:10px;padding:6px 8px;margin-top:4px;border-top:1px solid var(--line)}
.bgsw{width:48px;height:36px;border-radius:5px;border:1px solid #fff3}
.list{display:flex;flex-direction:column;gap:4px}
.litem{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:0;background:transparent;padding:10px;border-radius:9px;font-size:13.5px;font-weight:600}
.litem:hover{background:var(--panel-2)}
.litem small{font:500 11.5px var(--mono);color:var(--muted)}
.pz{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:start}
#pCurve{width:96px;height:96px;border-radius:10px;background:var(--panel-2);display:block}
.pzr{min-width:0;display:flex;flex-direction:column;gap:6px}
#pPad{width:100%;height:96px;border-radius:10px;background:var(--panel-2);touch-action:none;display:block;cursor:crosshair}
.gest{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.gest b{color:var(--fg);font-weight:600}
.arow{display:grid;grid-template-columns:110px minmax(120px,260px) 44px;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.arow output{font:500 12px var(--mono);color:var(--fg);text-align:right}
.ctitle{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#modal{position:fixed;inset:0;z-index:40;background:#000a;display:grid;place-items:center;padding:16px}
#modal .card{width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
#modal h3{margin:0;font-size:17px}
#modal p{margin:0}
#modal textarea{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);padding:10px;font:inherit;font-size:15px;resize:vertical}
#modal label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
#modal input[type=number]{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);padding:0 8px;font:inherit;width:110px}
.row2{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.mrow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.exp{width:100%;border-radius:10px;background:repeating-conic-gradient(#cfcfd6 0 25%,#fff 0 50%) 0 0/16px 16px;-webkit-touch-callout:default;user-select:auto}
#dropDot{position:fixed;left:0;top:0;width:28px;height:28px;border-radius:50%;border:2px solid #fff;z-index:50;pointer-events:none;box-shadow:0 4px 12px #000a}
.newgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.custom{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.custom input{width:80px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);padding:0 8px;font:500 13px var(--mono)}
@media (max-width:420px){.tb{width:33px;height:36px}.tb svg{width:20px;height:20px}.cbtn{width:34px}#colorDot{width:25px;height:25px}.blib{grid-template-columns:96px 1fr}.srow{grid-template-columns:96px 1fr 44px}.arow{grid-template-columns:84px 1fr 40px}}
@media (prefers-reduced-motion:reduce){#hud{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="grp">
      <button class="tb" id="bGallery" data-i="gallery" title="Gallery" aria-label="Gallery"></button>
      <button class="tb" id="bActions" data-i="wrench" title="Actions" aria-label="Actions"></button>
      <button class="tb" id="bAdjust" data-i="wand" title="Adjustments" aria-label="Adjustments"></button>
      <button class="tb" id="bSelect" data-i="select" title="Selection (M)" aria-label="Selection"></button>
      <button class="tb" id="bTransform" data-i="arrow" title="Transform (V)" aria-label="Transform"></button>
    </div>
    <div class="grp">
      <button class="tb" id="bPaint" data-i="brush" title="Paint (B) – tap again for brushes" aria-label="Paint"></button>
      <button class="tb" id="bSmudge" data-i="smudge" title="Smudge (S)" aria-label="Smudge"></button>
      <button class="tb" id="bErase" data-i="eraser" title="Erase (E)" aria-label="Erase"></button>
      <button class="tb" id="bFill" data-i="bucket" title="Fill (G)" aria-label="Fill"></button>
      <button class="tb" id="bLayers" data-i="layers" title="Layers (L)" aria-label="Layers"></button>
      <button class="cbtn" id="bColor" title="Colors (C) – drag onto canvas to fill" aria-label="Colors"><span id="colorDot"></span></button>
    </div>
  </header>
  <main id="stage">
    <canvas id="view"></canvas>
    <aside id="side">
      <div class="vs" id="vsSize" title="Brush size"><div class="fill"></div><div class="knob"></div></div>
      <button class="sq" id="bEye" data-i="dropper" title="Eyedropper (hold Alt)" aria-label="Eyedropper"></button>
      <div class="vs" id="vsOpac" title="Brush opacity"><div class="fill"></div><div class="knob"></div></div>
      <button class="sb" id="bUndo" data-i="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button class="sb" id="bRedo" data-i="redo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"></button>
    </aside>
    <div id="bubble" hidden></div>
    <div id="hud"></div>
    <div id="ctx" hidden></div>
  </main>
</div>
<div class="pop wide" id="pop-brushes" hidden></div>
<div class="pop" id="pop-color" hidden></div>
<div class="pop" id="pop-layers" hidden></div>
<div class="pop" id="pop-actions" hidden></div>
<div class="pop" id="pop-gallery" hidden></div>
<div class="pop" id="pop-adjust" hidden></div>
<div class="pop" id="pop-fill" hidden></div>
<div id="modal" hidden><div class="card" id="modalCard"></div></div>
<div id="dropDot" hidden></div>
<input type="file" id="fileIn" accept="image/*" hidden>

<script>
(()=>{
'use strict';
let deferredPrompt=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v,now=()=>performance.now(),TAU=Math.PI*2;
const store={get(k,d){try{const v=localStorage.getItem('easel.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('easel.'+k,JSON.stringify(v))}catch(e){}}};
let W=1600,H=1200;
function mk(w=W,h=H){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c}

/* ---------- icons ---------- */
const ICONS={
 gallery:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
 wrench:'M14.5 5.5a4 4 0 0 0-5 5L4 16v4h4l5.5-5.5a4 4 0 0 0 5-5l-2.6 2.6-2.4-.6-.6-2.4z',
 wand:'M4 20 14.5 9.5M16.5 7.5l1-1M18 3v2.5M21 6h-2.5M19.5 9.5l1.5 1.5M13 4l1.5 1.5',
 select:'M4 7V4h3M10 4h4M17 4h3v3M20 10v4M20 17v3h-3M14 20h-4M7 20H4v-3M4 14v-4',
 arrow:'M5 3l13 7.5-5.6 1.6L10 18z',
 brush:'M19.5 3.5c-3.5 1-8 5.2-10.2 8.6l2.6 2.6c3.4-2.2 7.6-6.7 8.6-10.2zM8.4 13.3c-2.4.1-3.9 1.8-3.9 3.9 0 1.2-.7 2-2 2.3 3.3 1.3 7.9.5 8.4-3.6z',
 smudge:'M8 12V6.5a1.6 1.6 0 0 1 3.2 0V11M11.2 10V5a1.6 1.6 0 0 1 3.2 0v5M14.4 10.5V7a1.6 1.6 0 0 1 3.2 0v6.5c0 4-2.7 7-6.2 7-2.6 0-4.4-1.5-5.6-4l-1.6-3.4a1.5 1.5 0 0 1 2.6-1.4L8 13',
 eraser:'M15.5 4.5l4 4L10 18H6l-2-2 11.5-11.5zM9 10.5l4.5 4.5M10 18h10',
 bucket:'M4.5 11.5L11 5l7.5 7.5L12 19zM4.5 11.5h14M19.5 15.5s1.5 1.9 1.5 3a1.5 1.5 0 0 1-3 0c0-1.1 1.5-3 1.5-3z',
 layers:'M12 3.5l8.5 4.5L12 12.5 3.5 8zM3.5 12l8.5 4.5 8.5-4.5M3.5 16l8.5 4.5 8.5-4.5',
 undo:'M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11',
 redo:'M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13',
 dropper:'M17.5 3.5a2.1 2.1 0 0 1 3 3L18 9l.8.8-1.6 1.6-4.6-4.6 1.6-1.6.8.8zM13.5 8.5 5 17v2h2l8.5-8.5'
};
const svg=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
$$('[data-i]').forEach(b=>b.innerHTML=svg(ICONS[b.dataset.i]));

/* ---------- prefs & state ---------- */
const prefs=Object.assign({finger:true,simPressure:true,quickShape:true,rightHand:false,grid:false,gridSize:100,penSeen:false,pLight:0},store.get('prefs',{}));
const savePrefs=()=>store.set('prefs',prefs);
const sym={mode:'off',n:6,mirror:false};
const fillOpts=Object.assign({tol:22,all:false},store.get('fill',{}));

/* ---------- colors ---------- */

function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
function hsv2rgb(h,s,v){const f=n=>{const k=(n+h/60)%6;return(v-v*s*Math.max(0,Math.min(k,4-k,1)))*255};return[f(5),f(3),f(1)]}

function softStops(g,h){for(let i=0;i<=12;i++){const t=i/12;let a;if(t<=h)a=1;else{const u=(t-h)/(1-h);a=.5+.5*Math.cos(Math.PI*u)}g.addColorStop(t,`rgba(255,255,255,${a.toFixed(3)})`)}}
function makeTips(kind,hard){
 const out=[],variants=['pencil','chalk','spray','bristle','wet','flat','grass','cloud'].includes(kind)?4:1;
 for(let v=0;v<variants;v++){
  const S=kind==='pencil'?128:256,c=mk(S,S),x=c.getContext('2d'),r=S/2;c._id=++tipId;x.fillStyle='#fff';
  if(kind==='round'||kind==='soft'){const g=x.createRadialGradient(r,r,0,r,r,r);softStops(g,Math.min(hard,1-3/S));x.fillStyle=g;x.fillRect(0,0,S,S)}
  else if(kind==='pencil'){x.beginPath();x.arc(r,r,r-1,0,TAU);x.fill();const d=x.getImageData(0,0,S,S),p=d.data;for(let i=3;i<p.length;i+=4)if(p[i])p[i]*=.25+.75*Math.random()**1.6;x.putImageData(d,0,0)}
  else if(kind==='chalk'){for(let i=0;i<260;i++){const a=Math.random()*TAU,rr=r*.9*Math.sqrt(Math.random());x.globalAlpha=.25+.7*Math.random();x.beginPath();x.arc(r+Math.cos(a)*rr,r+Math.sin(a)*rr,r*(.04+.09*Math.random()),0,TAU);x.fill()}}
  else if(kind==='spray'){for(let i=0;i<70;i++){const a=Math.random()*TAU,rr=r*.94*Math.sqrt(Math.random());x.globalAlpha=.6+.4*Math.random();x.beginPath();x.arc(r+Math.cos(a)*rr,r+Math.sin(a)*rr,(1+Math.random()*2.6)*S/128,0,TAU);x.fill()}}
  else if(kind==='bristle'){const n=30;for(let i=0;i<n;i++){const y=r+(i/(n-1)*2-1)*r*.86+(Math.random()-.5)*4,rr=r*(.05+.07*Math.random());x.globalAlpha=.35+.65*Math.random();x.beginPath();x.ellipse(r+(Math.random()-.5)*r*.3,y,rr*1.8,rr,0,0,TAU);x.fill()}}
  else if(kind==='wet'){const g=x.createRadialGradient(r,r,0,r,r,r);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.7,'rgba(255,255,255,.5)');g.addColorStop(.9,'rgba(255,255,255,.78)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();for(let k=0;k<=24;k++){const a=k/24*TAU,rr=r*(.8+.2*Math.random());k?x.lineTo(r+Math.cos(a)*rr,r+Math.sin(a)*rr):x.moveTo(r+rr,r)}x.closePath();x.fill()}
  else if(kind==='flat'){const n=18,hw=S*.13;for(let i=0;i<n;i++){const y0=S*.04+i/n*S*.92;x.globalAlpha=.4+.6*Math.random();x.fillRect(r-hw,y0,hw*2,S*.92/n*(.6+.5*Math.random()))}}
  else if(kind==='knife'){x.globalAlpha=.5;x.fillRect(r-S*.12,S*.03,S*.24,S*.94);x.globalAlpha=1;x.fillRect(r-S*.1,S*.05,S*.2,S*.9)}
  else if(kind==='grass'){const n=5+(Math.random()*3|0);for(let i=0;i<n;i++){const bx=r+(Math.random()-.5)*S*.35,top=S*(.05+.3*Math.random()),lean=(Math.random()-.5)*S*.5;x.globalAlpha=.75+.25*Math.random();x.beginPath();x.moveTo(bx-S*.035,S);x.quadraticCurveTo(bx+lean*.3,S*.55,bx+lean,top);x.quadraticCurveTo(bx+lean*.3+S*.02,S*.55,bx+S*.035,S);x.fill()}}
  else if(kind==='star'){const g=x.createRadialGradient(r,r,0,r,r,r*.45);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,S,S);x.fillStyle='#fff';x.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4,rr=k%2?r*.12:r*.95;x.lineTo(r+Math.cos(a)*rr,r+Math.sin(a)*rr)}x.closePath();x.fill()}
  else if(kind==='cloud'){for(let i=0;i<9;i++){const a=Math.random()*TAU,d=r*.4*Math.random(),cr=r*(.25+.25*Math.random()),cx=r+Math.cos(a)*d,cy=r+Math.sin(a)*d*.7,g=x.createRadialGradient(cx,cy,0,cx,cy,cr);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,S,S)}}
  out.push(buildMips(c))}

/* paper grain: tileable noise; where it is opaque, paint is knocked out */
const GRAIN=(()=>{const N=256,c=mk(N,N),x=c.getContext('2d'),id=x.createImageData(N,N),d=id.data,a=new Float32Array(N*N);for(let i=0;i<a.length;i++)a[i]=Math.random();
 const blur=(src,r)=>{const o=new Float32Array(N*N),o2=new Float32Array(N*N);for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){let s=0;for(let k=-r;k<=r;k++)s+=src[y*N+((xx+k+N)%N)];o[y*N+xx]=s/(2*r+1)}for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){let s=0;for(let k=-r;k<=r;k++)s+=o[((y+k+N)%N)*N+xx];o2[y*N+xx]=s/(2*r+1)}return o2};
 const big=blur(a,2),v=new Float32Array(N*N);let mn=1,mx=0;for(let i=0;i<v.length;i++){v[i]=big[i]*.7+a[i]*.3;if(v[i]<mn)mn=v[i];if(v[i]>mx)mx=v[i]}
 for(let i=0;i<v.length;i++){const t=(v[i]-mn)/(mx-mn);d[i*4]=d[i*4+1]=d[i*4+2]=255;d[i*4+3]=clamp((t-.35)*2.2,0,1)*255}x.putImageData(id,0,0);return c})();
function applyGrain(x,amount,r){if(!x._gp)x._gp=x.createPattern(GRAIN,'repeat');x.save();x.globalCompositeOperation='destination-out';x.globalAlpha=amount;x.fillStyle=x._gp;if(r)x.fillRect(r.x,r.y,r.w,r.h);else x.fillRect(0,0,x.canvas.width,x.canvas.height);x.restore()}
const tipStore=new Map(),tintStore=new Map();
function tipsFor(b){if(b.tip==='pixel')return null;const key=b.tip+((b.tip==='round'||b.tip==='soft')?'|'+(+b.hard).toFixed(2):'');let t=tipStore.get(key);if(!t){t=makeTips(b.tip,+b.hard);tipStore.set(key,t)}return t}
/* pre-shrunk copies of each tip so small dabs stay crisp instead of aliasing */
function buildMips(c){const m=[c];let p=c;while(p.width>4){const n=mk(Math.max(2,p.width>>1),Math.max(2,p.height>>1)),x=n.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(p,0,0,n.width,n.height);n._id=++tipId;m.push(n);p=n}c._mips=m;return c}
function tinted(tip,color){const k=tip._id+color;let c=tintStore.get(k);if(!c){if(tintStore.size>500)tintStore.clear();c=mk(tip.width,tip.height);const x=c.getContext('2d');x.drawImage(tip,0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);tintStore.set(k,c)}return c}
function stampDab(ctx,b,tips,color,x,y,s,ang,a,rnd){
 if(!tips){const q=Math.max(1,Math.round(s));ctx.globalAlpha=a;ctx.fillStyle=color;ctx.fillRect(Math.round(x-q/2),Math.round(y-q/2),q,q);ctx.globalAlpha=1;return}
 if(s<1.5){a*=s/1.5;s=1.5}
 const base=tips[tips.length>1?(Math.random()*tips.length|0):0],mm=base._mips||[base];let lv=mm[0];for(let i=mm.length-1;i>=0;i--){if(mm[i].width>=s){lv=mm[i];break}}
 const tip=tinted(lv,color);
 const sx=s/tip.width,sy=s*(rnd??b.roundness)/tip.height,cs=Math.cos(ang),sn=Math.sin(ang);

const tailLen=(b,size)=>Math.max(8,size*6*b.taper),endLen=(b,size)=>Math.max(6,size*3.5*b.taper);
function dabParams(b,size,pr,dist,dir,tilt=0,ef=1){
 let s=size*(1-b.sizeP+b.sizeP*pr);
 if(b.taper>0){const tl=tailLen(b,size);if(dist<tl)s*=.15+.85*(dist/tl)}

 if(b.jitterS)s*=1+(Math.random()*2-1)*b.jitterS;
 let a=clamp(b.flow*(1-b.opP+b.opP*pr),0,1),rnd=b.roundness;

class Walker{
 constructor(sp,on){this.sp=sp;this.on=on;this.last=null;this.rem=0;this.dist=0}
 add(x,y,pr){
  if(!this.last){this.last={x,y,pr};this.on(x,y,pr,0,0);this.rem=this.sp(pr);return}
  const L=this.last,dx=x-L.x,dy=y-L.y,d=Math.hypot(dx,dy);if(d<1e-3){L.pr=pr;return}
  const dir=Math.atan2(dy,dx);let t=this.rem,guard=0;
  while(t<=d&&guard++<20000){const k=t/d,p=L.pr+(pr-L.pr)*k;this.on(L.x+dx*k,L.y+dy*k,p,dir,this.dist+t);t+=this.sp(p)}
  this.rem=t-d;this.dist+=d;this.last={x,y,pr}}}
const spacingFn=(b,size)=>p=>Math.max(b.tip==='pixel'?1:.5,size*(1-b.sizeP+b.sizeP*p)*b.spacing);

 G={t:now(),max:ptrs.size,moved:0,d0:Math.max(1,Math.hypot(b.x-a.x,b.y-a.y)),a0:Math.atan2(b.y-a.y,b.x-a.x),V0:{s:V.s,r:V.r},docMid:toDoc(mid.x,mid.y),ids:[...ptrs.keys()].slice(0,2)};mode='gesture'}
function updateGesture(){const a=ptrs.get(G.ids[0]),b=ptrs.get(G.ids[1]);for(const p of ptrs.values())G.moved=Math.max(G.moved,Math.hypot(p.x-p.sx,p.y-p.sy));if(!a||!b)return;
 const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2},d=Math.max(1,Math.hypot(b.x-a.x,b.y-a.y)),ang=Math.atan2(b.y-a.y,b.x-a.x);
 V.s=clamp(G.V0.s*d/G.d0,.03,64);V.r=G.V0.r+(ang-G.a0)*V.flip;setViewKeeping(G.docMid,mid)}
function endGesture(){const dur=now()-G.t;
 if(dur<300&&G.moved<14){if(G.max===2)undo();else if(G.max>=3)redo()}
 else if(dur<300&&V.s<G.V0.s*.65)fit();
 else{const n=((V.r%TAU)+TAU+Math.PI)%TAU-Math.PI;if(Math.abs(n)<.09){const c={x:vw/2,y:vh/2},d=toDoc(c.x,c.y);V.r=0;setViewKeeping(d,c)}}
 G=null}
function startPan(p){mode='pan';P0={x:p.x,y:p.y,cx:V.cx,cy:V.cy}}
view.addEventListener('pointerdown',e=>{
 e.preventDefault();stageRect=stage.getBoundingClientRect();
 if(openPopId){closePops();swallow.add(e.pointerId);return}
 try{view.setPointerCapture(e.pointerId)}catch(err){}
 const p=lxy(e);ptrs.set(e.pointerId,{x:p.x,y:p.y,sx:p.x,sy:p.y,type:e.pointerType});
 if(e.pointerType==='pen'&&!prefs.penSeen){prefs.penSeen=true;prefs.finger=false;savePrefs();toast('Stylus detected: fingers now pan and zoom (change in Actions)')}
 if(e.pointerType==='touch'&&ptrs.size>=2){
  clearTimeout(holdTimer);
  if(mode==='draw'&&stroke){if(now()-stroke.start<300||stroke.moved<30)cancelStroke();else endStroke()}
  if(mode==='eye')eye=null;if(mode==='sel')selDraft=null;if(tf)tf.drag=null;
  if(mode==='tfpinch')return;
  if(tf&&!G&&ptrs.size===2){const ps=[...ptrs.values()],mid={x:(ps[0].x+ps[1].x)/2,y:(ps[0].y+ps[1].y)/2};if(insideTf(mid)||insideTf(ps[0])||insideTf(ps[1])){startTfPinch();return}}
  if(!G)startGesture();else G.max=Math.max(G.max,ptrs.size);mode='gesture';requestRender();return}
 if(mode==='gesture'||ptrs.size>1)return;
 if(e.button===1||keys.space){startPan(p);return}
 if(e.button===2)return;
 if(pendingEye||keys.alt){mode='eye';eye={old:colorHex,cur:colorHex,x:p.x,y:p.y};eyeAt(p.x,p.y);return}
 const fingerOK=e.pointerType!=='touch'||prefs.finger;
 if(adj){if(!fingerOK)startPan(p);return}
 if(!fingerOK){startPan(p);return}
 if(tf){mode='tf';tfDown(p.x,p.y,e.pointerType==='touch');return}
 if(tool==='paint'||tool==='erase'||tool==='smudge'){
  if(!canPaint())return;mode='draw';beginStroke(e,toDoc(p.x,p.y));
  if(e.pointerType==='touch'){const id=e.pointerId;holdTimer=setTimeout(()=>{const q=ptrs.get(id);if(mode==='draw'&&stroke&&stroke.moved<8&&q){cancelStroke();mode='eye';eye={old:colorHex,cur:colorHex,x:q.x,y:q.y};eyeAt(q.x,q.y)}},500)}}
 else if(tool==='fill')mode='fill';
 else if(tool==='select'){mode='sel';selDraft={pts:[toDoc(p.x,p.y)]}}});
view.addEventListener('pointermove',e=>{
 const p=lxy(e);if(e.pointerType==='mouse'){hover=p;if(!ptrs.size)requestRender()}else hover=null;
 const pt=ptrs.get(e.pointerId);if(!pt)return;pt.x=p.x;pt.y=p.y;
 switch(mode){
  case'gesture':if(G)updateGesture();break;
  case'tfpinch':if(TP)moveTfPinch();break;
  case'pan':V.cx=P0.cx+p.x-P0.x;V.cy=P0.cy+p.y-P0.y;viewChanged();break;
  case'draw':if(stroke)strokeMove(e);if(e.pointerType==='mouse')requestRender();break;
  case'eye':eyeAt(p.x,p.y);break;
  case'sel':if(selDraft){selDraft.pts.push(toDoc(p.x,p.y));requestRender()}break;
  case'tf':if(tf&&tf.drag)tfMove(p.x,p.y);break}});
function onUp(e){
 if(swallow.delete(e.pointerId))return;const pt=ptrs.get(e.pointerId);if(!pt)return;ptrs.delete(e.pointerId);
 if(mode==='tfpinch'){if(ptrs.size===0){mode=null;TP=null}return}
 if(mode==='gesture'){if(ptrs.size===0){if(G)endGesture();mode=null}return}
 switch(mode){
  case'draw':endStroke();break;
  case'eye':if(eye&&eye.cur){setHex(eye.cur);pushColorHistory()}eye=null;setPendingEye(false);break;
  case'fill':if(e.type==='pointerup')floodFill(toDoc(pt.x,pt.y));break;
  case'sel':finishSel();break;
  case'tf':if(tf)tf.drag=null;break}

view.addEventListener('pointerup',onUp);view.addEventListener('pointercancel',onUp);
view.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hover=null;requestRender()}});
view.addEventListener('contextmenu',e=>e.preventDefault());
view.addEventListener('wheel',e=>{e.preventDefault();stageRect=stage.getBoundingClientRect();const p=lxy(e),d=toDoc(p.x,p.y);
 if(e.shiftKey&&!e.ctrlKey){V.r+=(e.deltaY>0?1:-1)*Math.PI/36;setViewKeeping(d,p);return}
 const dy=e.deltaMode===1?e.deltaY*16:e.deltaY;V.s=clamp(V.s*Math.exp(-dy*(e.ctrlKey?.01:.0015)),.03,64);setViewKeeping(d,p)},{passive:false});

/* color dot: tap = colors, drag = ColorDrop */
(()=>{const cb=$('#bColor'),dot=$('#dropDot');let cd=null;
 cb.addEventListener('pointerdown',e=>{e.preventDefault();try{cb.setPointerCapture(e.pointerId)}catch(err){}cd={x:e.clientX,y:e.clientY,drag:false}});
 cb.addEventListener('pointermove',e=>{if(!cd)return;if(!cd.drag&&Math.hypot(e.clientX-cd.x,e.clientY-cd.y)>14){cd.drag=true;closePops();dot.hidden=false;dot.style.background=colorHex}if(cd.drag)dot.style.transform=`translate(${e.clientX-14}px,${e.clientY-14}px)`});
 cb.addEventListener('pointerup',e=>{if(!cd)return;const d=cd;cd=null;dot.hidden=true;if(!d.drag){togglePop('color',cb);return}
  const r=stage.getBoundingClientRect();if(e.clientX>r.left&&e.clientX<r.right&&e.clientY>r.top&&e.clientY<r.bottom){stageRect=r;floodFill(toDoc(e.clientX-r.left,e.clientY-r.top))}});
 cb.addEventListener('pointercancel',()=>{cd=null;dot.hidden=true})})();

/* top bar & sidebar buttons */
const brushBtn=t=>()=>{if(tool===t)togglePop('brushes',$({paint:'#bPaint',smudge:'#bSmudge',erase:'#bErase'}[t]));else{closePops();setTool(t)}};
$('#bPaint').onclick=brushBtn('paint');$('#bSmudge').onclick=brushBtn('smudge');$('#bErase').onclick=brushBtn('erase');
$('#bFill').onclick=()=>{if(tool==='fill')togglePop('fill');else{closePops();setTool('fill')}};
$('#bSelect').onclick=()=>{closePops();setTool(tool==='select'?lastBrushTool:'select')};
$('#bTransform').onclick=()=>{closePops();if(tool==='transform'){commitTransform();setTool(lastBrushTool)}else setTool('transform')};
$('#bLayers').onclick=()=>togglePop('layers');$('#bActions').onclick=()=>togglePop('actions');$('#bGallery').onclick=()=>togglePop('gallery');$('#bAdjust').onclick=()=>togglePop('adjust');
$('#bEye').onclick=()=>setPendingEye(!pendingEye);$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;
addEventListener('resize',()=>{resize();if(openPopId){const p=$('#pop-'+openPopId);placePop(p,popBtn[openPopId]?$(popBtn[openPopId]):$('.tb.on'))}});

/* keyboard */
const keys={space:false,alt:false};
addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea,select'))return;
 if(e.code==='Space'){keys.space=true;e.preventDefault();return}
 if(e.key==='Alt'){keys.alt=true;e.preventDefault();return}
 const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
 if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(mod&&k==='y'){e.preventDefault();redo();return}
 if(mod&&k==='d'){e.preventDefault();clearSel();return}
 if(mod&&k==='a'){e.preventDefault();selectAll();return}
 if(mod||!$('#modal').hidden)return;
 const act={b:()=>setTool('paint'),s:()=>setTool('smudge'),e:()=>setTool('erase'),g:()=>setTool('fill'),m:()=>setTool('select'),v:()=>setTool('transform'),'[':()=>nudgeSize(-1),']':()=>nudgeSize(1),'0':fit,l:()=>togglePop('layers'),c:()=>togglePop('color',$('#bColor')),
  escape:()=>{closePops();if(tf)cancelTransform();if(adj)cancelAdj()},enter:()=>{if(tf){commitTransform();setTool(lastBrushTool)}if(adj)applyAdj()}}[k];
 if(act){e.preventDefault();act()}});
addEventListener('keyup',e=>{if(e.code==='Space')keys.space=false;if(e.key==='Alt')keys.alt=false});
addEventListener('blur',()=>{keys.space=keys.alt=false});

/* ---------- persistence (IndexedDB) ---------- */
const IDB={p:null,open(){if(!this.p)this.p=new Promise((res,rej)=>{try{const r=indexedDB.open('easel-studio',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return this.p},
 async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
 async get(k){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}};
let saveT=0,saving=false;
function markSave(){clearTimeout(saveT);saveT=setTimeout(saveDoc,1800)}
async function saveDoc(){if(stroke||saving){markSave();return}saving=true;
 try{const layers=[];for(const l of doc.layers){if(l.saveDirty||!l.blob){l.saveDirty=false;l.blob=await new Promise(r=>l.canvas.toBlob(r,'image/png'))}layers.push({name:l.name,visible:l.visible,opacity:l.opacity,blend:l.blend,alphaLock:l.alphaLock,clip:l.clip,blob:l.blob})}
  await IDB.put('doc',{v:1,W,H,bg:doc.bg,bgVisible:doc.bgVisible,active:doc.layers.indexOf(doc.active),layers})}catch(e){}saving=false}
function blobImg(b){return window.createImageBitmap?createImageBitmap(b):new Promise((res,rej)=>{const u=URL.createObjectURL(b),i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u})}
async function loadDoc(){try{const d=await IDB.get('doc');if(!d||!d.layers||!d.layers.length)return false;W=d.W;H=d.H;allocDoc();doc.layers=[];
 for(const m of d.layers){const l=newLayer(m.name);Object.assign(l,{visible:m.visible,opacity:m.opacity,blend:m.blend,alphaLock:m.alphaLock,clip:m.clip});if(m.blob){l.ctx.drawImage(await blobImg(m.blob),0,0);l.blob=m.blob;l.saveDirty=false}doc.layers.push(l)}
 doc.active=doc.layers[d.active]||doc.layers[doc.layers.length-1];doc.bg=d.bg||'#ffffff';doc.bgVisible=d.bgVisible!==false;return true}catch(e){return false}}
addEventListener('pagehide',()=>{clearTimeout(saveT);saveDoc()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(saveT);saveDoc()}});

/* ---------- new document & sample sheet ---------- */
function newDocument(w,h,samples){
 if(tf){tf=null;hideCtx()}if(adj){adj=null;hideCtx()}stroke=null;preview=null;
 W=w;H=h;allocDoc();hasSel=false;hist.length=0;redoS.length=0;doc.layers=[];doc.bg='#ffffff';doc.bgVisible=true;
 if(samples){const s=newLayer('Brush samples');drawSamples(s);doc.layers.push(s)}
 const l=newLayer(samples?'Sketch':'Layer 1');doc.layers.push(l);doc.active=l;
 tool==='transform'&&(tool=lastBrushTool);setTool(['select','fill'].includes(tool)?tool:lastBrushTool);fit();markDirty();markSave()}
function drawSamples(layer){const n=BRUSHES.length,cols=W>H?4:3,rows=Math.ceil(n/cols),cw=W/cols,ch=H/rows,x=layer.ctx,inks=['#22283a','#b4472e','#2c6fb6','#3b8a58','#6a4bb8','#c08a1e'];
 const cats=[...new Set(BRUSHES.map(b=>b.cat))];x.textBaseline='top';
 BRUSHES.forEach((b,i)=>{const c=i%cols,r=Math.floor(i/cols),x0=c*cw,y0=r*ch,fs=Math.max(10,Math.min(26,ch*.17));
  x.font=`600 ${fs}px Manrope, system-ui, sans-serif`;x.fillStyle='#8a8d99';x.fillText(b.name.toUpperCase(),x0+cw*.08,y0+ch*.1);
  const size=clamp(b.size,2,ch*.22),pts=wavePts(x0+cw*.08,x0+cw*.92,y0+ch*.62,ch*.14,90);strokeInto(x,buf,b,size,inks[cats.indexOf(b.cat)%inks.length],pts,b.opacity)});
 bctx.clearRect(0,0,W,H)}

/* ---------- init ---------- */
(async()=>{
 allocDoc();resize();setHex(colorHex);updateSide();
 const ok=await loadDoc();
 if(!ok){try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1200))])}catch(e){}const long=clamp(Math.round(Math.max(vw,vh)*Math.max(1,DPR)*1.4),2000,2800),a=Math.max(.5,Math.min(2,vw/Math.max(1,vh)));newDocument(a>=1?long:Math.round(long*a),a>=1?Math.round(long/a):long,true);toast('Brush samples are on their own layer. Hide or delete it in Layers.')}
 else{fit();markDirty()}
 setTool('paint')})();
})();
